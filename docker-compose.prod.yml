
services:

  api:
    image: ${ECR_REGISTRY}/finmarket-api:${IMAGE_TAG}
    container_name: finmarket_api
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    networks:
      - finmarket_network

  celery_worker:
    image: ${ECR_REGISTRY}/finmarket-api:${IMAGE_TAG}
    container_name: finmarket_celery_worker
    env_file:
      - .env.prod
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    networks:
      - finmarket_network

  celery_beat:
    image: ${ECR_REGISTRY}/finmarket-api:${IMAGE_TAG}
    container_name: finmarket_celery_beat
    env_file:
      - .env.prod
    restart: always
    command: celery -A app.tasks.celery_app beat --loglevel=info
    networks:
      - finmarket_network

  redis:
    image: redis:7-alpine
    container_name: finmarket_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - finmarket_network

volumes:
  redis_data:

networks:
  finmarket_network:
    driver: bridge